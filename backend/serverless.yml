service: studyquest-backend
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-northeast-2
  environment:
    STAGE: ${opt:stage, 'dev'}
    REDIS_ENDPOINT: ${env:REDIS_ENDPOINT, ''}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, ''}
    COGNITO_APP_CLIENT_ID: ${env:COGNITO_APP_CLIENT_ID, ''}
    COGNITO_REGION: ${env:COGNITO_REGION, 'ap-northeast-2'}
    COGNITO_JWKS_URL: ${env:COGNITO_JWKS_URL, ''}
    DYNAMO_USER_PROFILE_TABLE: ${env:DYNAMO_USER_PROFILE_TABLE, 'StudyQuestUserProfile'}
    USER_TABLE: ${env:USER_TABLE, 'StudyQuestUserProfile'}
    SUBSCRIPTION_TABLE: ${env:SUBSCRIPTION_TABLE, 'StudyQuestSubscription'}
    GOOGLE_PLAY_CLIENT_EMAIL: ${env:GOOGLE_PLAY_CLIENT_EMAIL, ''}
    GOOGLE_PLAY_PRIVATE_KEY: ${env:GOOGLE_PLAY_PRIVATE_KEY, ''}
    APPLE_ISSUER_ID: ${env:APPLE_ISSUER_ID, ''}
    APPLE_KEY_ID: ${env:APPLE_KEY_ID, ''}
    APPLE_PRIVATE_KEY: ${env:APPLE_PRIVATE_KEY, ''}
  httpApi:
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_58zW0bxuN
        audience:
          - 7a1jshl008fiuad8lk8lsntgk4
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:*
            - rds-data:*
            - s3:*
            - events:PutEvents
            - cognito-idp:AdminConfirmSignUp
            - cognito-idp:InitiateAuth
            - cognito-idp:SignUp
            - cognito-idp:GetUser
          Resource: '*'

package:
  individually: true

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild

custom:
  dotenv:
    path: .env.cognito
  cognitoUserPoolId: ${env:COGNITO_USER_POOL_ID, 'ap-northeast-2_58zW0bxuN'}
  cognitoAppClientId: ${env:COGNITO_APP_CLIENT_ID, '7a1jshl008fiuad8lk8lsntgk4'}
  cognitoRegion: ${env:COGNITO_REGION, 'ap-northeast-2'}
  esbuild:
    bundle: true
    minify: false
    sourcemap: false
    target: node20
    platform: node
    concurrency: 10

functions:
  auth:
    handler: services/auth-service/src/handler.handler
    events:
      - httpApi:
          path: /auth/signup
          method: post
      - httpApi:
          path: /auth/login
          method: post
      - httpApi:
          path: /auth/verify-email
          method: post
      - httpApi:
          path: /auth/resend-code
          method: post
      - httpApi:
          path: /auth/refresh
          method: post
      - httpApi:
          path: /auth/profile
          method: get
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /auth/profile
          method: put
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /auth/password
          method: put
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /auth/account
          method: delete
          authorizer:
            name: cognitoAuthorizer
  subscription:
    handler: services/subscription-service/src/handler.handler
    events:
      - httpApi:
          path: /subscription
          method: post
  plan:
    handler: services/plan-service/src/handler.handler
    environment:
      DYNAMO_QUEST_TABLE: ${env:DYNAMO_QUEST_TABLE, 'StudyQuestQuestTimeline'}
    events:
      - httpApi:
          path: /plan
          method: post
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /plan
          method: get
          authorizer:
            name: cognitoAuthorizer
  focus:
    handler: services/focus-service/src/handler.handler
    environment:
      DYNAMO_FOCUS_TABLE: ${env:DYNAMO_FOCUS_TABLE, 'StudyQuestFocusSession'}
      EVENT_BUS_ARN: ${env:EVENT_BUS_ARN, ''}
    events:
      - httpApi:
          path: /focus
          method: post
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /focus
          method: get
          authorizer:
            name: cognitoAuthorizer
  quiz:
    handler: services/quiz-service/src/handler.handler
    environment:
      DYNAMO_QUIZ_TABLE: ${env:DYNAMO_QUIZ_TABLE, 'StudyQuestQuizContent'}
      DYNAMO_QUIZ_RESULT_TABLE: ${env:DYNAMO_QUIZ_RESULT_TABLE, 'StudyQuestQuizResult'}
      DYNAMO_USER_STATS_TABLE: ${env:DYNAMO_USER_STATS_TABLE, 'StudyQuestUserStats'}
      S3_QUIZ_BUCKET: ${env:S3_QUIZ_BUCKET, ''}
      AI_PROXY_URL: ${env:AI_PROXY_URL, ''}
      AI_PROXY_API_KEY: ${env:AI_PROXY_API_KEY, ''}
    events:
      - httpApi:
          path: /quiz
          method: post
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /quiz
          method: get
          authorizer:
            name: cognitoAuthorizer
  quizCampSubmit:
    handler: services/quiz-service/src/handler.submitCampQuizResult
    environment:
      DYNAMO_QUIZ_RESULT_TABLE: ${env:DYNAMO_QUIZ_RESULT_TABLE, 'StudyQuestQuizResult'}
      DYNAMO_USER_STATS_TABLE: ${env:DYNAMO_USER_STATS_TABLE, 'StudyQuestUserStats'}
    events:
      - httpApi:
          path: /quiz/camp/submit
          method: post
          authorizer:
            name: cognitoAuthorizer
  quizCampStats:
    handler: services/quiz-service/src/handler.getCampQuizStats
    environment:
      DYNAMO_USER_STATS_TABLE: ${env:DYNAMO_USER_STATS_TABLE, 'StudyQuestUserStats'}
    events:
      - httpApi:
          path: /quiz/camp/stats/{userId}
          method: get
          authorizer:
            name: cognitoAuthorizer
  chat:
    handler: services/chat-service/src/handler.handler
    events:
      - httpApi:
          path: /chat
          method: post
          authorizer:
            name: cognitoAuthorizer
  stats:
    handler: services/stats-service/src/handler.handler
    environment:
      DYNAMO_STATS_TABLE: ${env:DYNAMO_STATS_TABLE, 'StudyQuestStatsSnapshot'}
      S3_STATS_BUCKET: ${env:S3_STATS_BUCKET, ''}
    events:
      - httpApi:
          path: /stats
          method: get
          authorizer:
            name: cognitoAuthorizer
  aiProxy:
    handler: services/ai-proxy-service/src/handler.handler
    events:
      - httpApi:
          path: /ai
          method: post
          authorizer:
            name: cognitoAuthorizer
  camp:
    handler: services/camp-service/src/handler.handler
    environment:
      DYNAMO_CAMP_TABLE: ${env:DYNAMO_CAMP_TABLE, 'StudyQuestCamp'}
      DYNAMO_CAMP_MEMBER_TABLE: ${env:DYNAMO_CAMP_MEMBER_TABLE, 'StudyQuestCampMember'}
      DYNAMO_MISSION_TABLE: ${env:DYNAMO_MISSION_TABLE, 'StudyQuestMission'}
    events:
      - httpApi:
          path: /camp
          method: get
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /camp
          method: post
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /camp/{campId}/join
          method: post
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /camp/{campId}/dashboard
          method: get
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /camp/{campId}/mission/complete
          method: post
          authorizer:
            name: cognitoAuthorizer
  calendar:
    handler: services/calendar-service/src/handler.handler
    environment:
      DYNAMO_CALENDAR_TABLE: ${env:DYNAMO_CALENDAR_TABLE, 'StudyQuestCalendar'}
    events:
      - httpApi:
          path: /calendar/goals
          method: get
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /calendar/goal
          method: post
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /calendar/goal/{goalId}
          method: put
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /calendar/goal/{goalId}
          method: delete
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /calendar/task/progress
          method: post
          authorizer:
            name: cognitoAuthorizer
      - httpApi:
          path: /calendar/tasks/progress
          method: get
          authorizer:
            name: cognitoAuthorizer

resources:
  Resources:
    StudyQuestCalendarTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: StudyQuestCalendar
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        Tags:
          - Key: Environment
            Value: ${opt:stage, 'dev'}
          - Key: Service
            Value: calendar-service
